http:
  routers:
    # Router for HTTP (port 80)
    queue-web-80-http-frontend:
      entrypoints:
        - http-80
      rule: HostRegexp(`^frontend\.queue\.test$`)
      service: 'queue-web-3000'
      ruleSyntax: v3
      tls: false
      priority: 100

    # Router for HTTPS (port 443)
    queue-web-80-https-frontend:
      entrypoints:
        - http-443
      rule: HostRegexp(`^frontend\.queue\.test$`)
      service: 'queue-web-3000'
      ruleSyntax: v3
      tls: true
      priority: 100

  services:
    # The custom service that routes to your Node app
    queue-web-3000:
      loadbalancer:
        servers:
          - url: http://ddev-queue-web:3000
